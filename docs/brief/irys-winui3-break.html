<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRYS · WinUI 3 break brief</title><style>
:root{color-scheme:dark;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#f4f8fb;background:#0e141d;--accent:#72bfff;--surface:#17212cd9;--line:#a8c7e01f;--muted:#b7c3cf}*{box-sizing:border-box}body{margin:0;min-width:900px}.stage{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 46% 37%,#183a59 0%,#102437 35%,#0e141d 76%)}.top{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:22px 30px;color:#d6e0ea;font-size:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.6px}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px #72bfff99}.quiet{padding:8px 13px;border:1px solid #a8c7e04a;border-radius:4px;background:#ffffff0d;color:#f4f8fb;font:inherit}.panel{width:min(1000px,calc(100vw - 130px));display:grid;grid-template-columns:.9fr 1.1fr;gap:60px;align-items:center;padding:52px 64px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 30px 90px #0009;backdrop-filter:blur(20px)}.orb{display:grid;place-items:center;width:330px;height:330px;margin:auto;border-radius:50%;background:conic-gradient(var(--accent) 0 286deg,#ffffff1c 286deg 360deg);box-shadow:0 0 65px #2d84c54d}.orb::before{content:"";grid-area:1/1;width:300px;height:300px;border-radius:50%;background:#101c29}.eye{grid-area:1/1;width:164px;height:164px;color:var(--accent);overflow:visible}.sclera{fill:#dceeff}.pupil{fill:#07131f}.glint{fill:white;opacity:.9}.lid-line,.lash{fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;opacity:.92}.lash{stroke-width:3;opacity:.5}.blink{transform-origin:60px 60px;animation:blink 7s cubic-bezier(.2,.8,.2,1) infinite}.gaze{transform-origin:60px 60px;animation:look-far 10s cubic-bezier(.2,.8,.2,1) infinite}.pupil{animation:dilate 10s cubic-bezier(.2,.8,.2,1) infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.06)}}@keyframes look-far{0%,100%{transform:translate(0,0)}25%,70%{transform:translate(11px,-5px)}}@keyframes dilate{0%,100%{r:8px}30%,70%{r:12px}}.count{grid-area:1/1;margin-top:215px;font:600 27px "Cascadia Mono",monospace;font-variant-numeric:tabular-nums}.copy h1{margin:0;font-size:42px;letter-spacing:-1px}.copy p{max-width:440px;color:var(--muted);font-size:17px;line-height:1.55}.rule{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:29px 0}.rule div{padding:13px;background:#ffffff0a;border:1px solid #a8c7e020;border-radius:4px}.rule b{display:block;color:var(--accent);font-size:19px}.rule span{font-size:12px;color:#bdc8d3}.actions{display:flex;gap:10px}.primary,.secondary{padding:11px 18px;border-radius:4px;border:1px solid transparent;font:600 14px inherit}.primary{background:var(--accent);color:#002b4b}.secondary{background:#ffffff0d;border-color:#a8c7e04a;color:#fff}.hint{margin-top:16px;color:#9eafbf;font-size:12px}.hint kbd{padding:2px 5px;border:1px solid #a8c7e052;border-radius:3px;color:#fff}@media(prefers-reduced-motion:reduce){.blink,.gaze,.pupil{animation:none}.pupil{r:11px}}@media(max-width:980px){.panel{grid-template-columns:1fr;gap:24px;width:90%;padding:40px}.orb{width:250px;height:250px}.orb::before{width:226px;height:226px}.eye{width:124px;height:124px}.count{margin-top:164px}}
</style></head><body><div class="stage"><header class="top"><div class="brand"><i class="dot"></i>IRYS</div><button class="quiet">Corner reminder</button></header><main class="panel"><div class="orb"><svg class="eye" viewBox="0 0 120 120" role="img" aria-label="An eye, resting"><defs><radialGradient id="irisFill" cx="50%" cy="45%" r="60%"><stop offset="0%" stop-color="#c6e7ff"/><stop offset="55%" stop-color="#72bfff"/><stop offset="100%" stop-color="#005a9e"/></radialGradient><clipPath id="lidClip"><path d="M8 60c14-22 31-33 52-33s38 11 52 33c-14 22-31 33-52 33S22 82 8 60Z"/></clipPath></defs><g class="blink"><g clip-path="url(#lidClip)"><path class="sclera" d="M8 60c14-22 31-33 52-33s38 11 52 33c-14 22-31 33-52 33S22 82 8 60Z"/><g class="gaze"><circle cx="60" cy="60" r="19" fill="url(#irisFill)"/><circle class="pupil" cx="60" cy="60" r="8"/><circle class="glint" cx="53" cy="52" r="4"/></g></g><path class="lid-line" d="M8 60c14-22 31-33 52-33s38 11 52 33c-14 22-31 33-52 33S22 82 8 60Z"/><path class="lash" d="M60 20v-9M92 29l6-7M28 29l-6-7"/></g></svg><div class="count">00:19</div></div><section class="copy"><h1>Look into the distance</h1><p>Find something about 30 feet away. Let your focus soften, blink a few times, and give your eyes a short reset.</p><div class="rule"><div><b>30</b><span>minutes of focus</span></div><div><b>30 ft</b><span>look into the distance</span></div><div><b>30 s</b><span>for your eyes to rest</span></div></div><div class="actions"><button class="secondary">Snooze 5 minutes</button><button class="primary">Skip this break</button></div><div class="hint">Press <kbd>Esc</kbd> to skip · This reminder is always dismissible</div></section></main></div></body></html>
