name: Release

# Tag-triggered release automation.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Builds Windows installers (needs MSVC / WiX) and Linux packages (deb +
# AppImage) in parallel, then publishes every artifact onto the same GitHub
# Release. ci.yml still runs on every push; this only fires on a version tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write # required to create the release

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and Rust gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Re-run the gates before publishing. platform/win.rs only compiles on
      # Windows, so this must not be skipped just because Linux passed locally.
      - name: Verify before publishing
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features

      # Fails the release if the tag does not match the version that would ship,
      # which is otherwise an easy and confusing mistake.
      - name: Check the tag matches tauri.conf.json
        shell: bash
        env:
          # Passed via env rather than interpolated into the script, so a tag
          # containing shell metacharacters cannot execute anything.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          raw="${INPUT_TAG:-$REF_NAME}"
          tag="${raw#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$tag  tauri.conf.json=$conf"
          if [ "$tag" != "$conf" ]; then
            echo "::error::Tag $tag does not match tauri.conf.json version $conf"
            exit 1
          fi

  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Build installers
        run: bun run tauri build --bundles msi,nsis

      - uses: actions/upload-artifact@v7
        with:
          name: irys-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            file

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v7
        with:
          name: irys-linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: irys-windows-installers
          path: dist/windows

      - uses: actions/download-artifact@v8
        with:
          name: irys-linux-packages
          path: dist/linux

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Publishes directly rather than as a draft. Pushing a v* tag is
          # already a deliberate act, so the tag is the gate. Flip to true if you
          # would rather review each release before it goes public.
          draft: false
          generate_release_notes: true
          files: |
            dist/windows/**/*.msi
            dist/windows/**/*.exe
            dist/linux/**/*.deb
            dist/linux/**/*.AppImage
          body: |
            Irys keeps the 30-30-30 rule for you: every 30 minutes, look about
            30 feet (10 m) away for 30 seconds.

            **Which file to download**

            Windows:
            - `*-setup.exe` (NSIS) - installs for the current user, no admin needed
            - `*.msi` - installs for all users, requires admin

            Linux:
            - `*.AppImage` - run directly (chmod +x, then execute)
            - `*.deb` - Debian / Ubuntu (`sudo apt install ./Irys_*.deb`)

            Windows builds are **unsigned**, so SmartScreen will warn on first
            run: More info -> Run anyway.

            On Linux, idle-skip and fullscreen-defer still use safe stubs (they
            never suppress). Everything else works natively, including on
            Wayland / Hyprland.
