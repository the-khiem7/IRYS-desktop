name: CI

# The development machine is a managed workstation without administrator
# rights, so Visual Studio Build Tools cannot be installed there and no Rust
# step can run locally - not even `cargo check`, since tauri-build's build.rs
# must be linked and executed first.
#
# GitHub's windows-latest runner ships MSVC and the Windows SDK preinstalled,
# which makes CI the place where this project is actually verified. Treat a
# green run here as the build gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npx vite build

  rust:
    name: Rust core - fmt, clippy, tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The real safety net: the whole 30-30-30 schedule, including both
      # suppression rules and sleep/wake, with no window on screen.
      - name: Tests
        working-directory: src-tauri
        run: cargo test --all-features

  bundle:
    name: Windows installers
    runs-on: windows-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Runs the frontend build via beforeBuildCommand, then compiles and
      # bundles. Unsigned: Windows SmartScreen will warn on first run, which is
      # expected until there is a code-signing certificate.
      - name: Build installers
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: irys-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
