# The local development loop, so neither linting nor building needs GitHub.
#
#   docker compose -f docker/compose.yml run --rm -T verify          # fmt, clippy, 43 tests
#   docker compose -f docker/compose.yml run --rm -T build-windows   # NSIS installer -> ./out
#   docker compose -f docker/compose.yml run --rm shell              # poke around
#
# CI is kept for release automation, not for this loop.
#
# The repo is bind-mounted so host edits are picked up with no rebuild. Three
# directories are deliberately overlaid with volumes instead:
#
#   node_modules  the host's copy holds Windows binaries that cannot run here
#   build output  keeps container and host frontend/docs builds from fighting
#   /build/*      cargo, target and the Windows SDK cache, kept away from the
#                 host's src-tauri/target, which belongs to a different toolchain

x-toolchain: &toolchain
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: irys-toolchain:local
  init: true
  volumes:
    - ..:/app
    - node-modules:/app/node_modules
    - frontend-dist:/app/dist
    - docs-site-dist:/app/docs-site/dist
    - docs-site-astro:/app/docs-site/.astro
    - cargo-registry:/build/cargo
    - cargo-target:/build/target
    - xwin-cache:/build/xwin
    - tauri-cache:/build/cache

services:
  # Fast gate: everything that is not #[cfg(windows)], including all 43 tests.
  verify:
    <<: *toolchain
    command: verify

  # Cross-compiles a Windows installer into ./out on the host. Defaults to the
  # dev profile, which is far faster and plenty for behaviour testing; pass
  # `release` for the optimised build that actually ships.
  build-windows:
    <<: *toolchain
    command: build-windows

  build-windows-release:
    <<: *toolchain
    command: build-windows release

  shell:
    <<: *toolchain
    command: bash

volumes:
  node-modules:
  frontend-dist:
  docs-site-dist:
  docs-site-astro:
  cargo-registry:
  cargo-target:
  xwin-cache:
  tauri-cache:
